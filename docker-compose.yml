services:
  calculator:
    image: ${DOCKER_IMAGE:-calculator}:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    networks:
      - calc-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
